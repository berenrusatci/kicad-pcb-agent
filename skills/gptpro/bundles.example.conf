# bundles.conf — bundle definitions for scripts/export.sh
#
# Syntax:
#   define_bundle <name> "<description>" <source>...
#
# Sources (paths relative to PROJECT_ROOT):
#   dir:<path>                 copy a directory
#   dir:<path>:<extra-exclude> copy a directory, excluding an extra pattern
#   file:<path>                copy a single file to the bundle root
#   file:<path>:<subdir>       copy a single file into <subdir>/
#
#   optional:<any of the above>   the source MAY be absent
#
# MISSING SOURCES ARE FATAL.
#
# In a hand-written config a missing `dir:`/`file:` is not a layout variation,
# it is lost evidence: the export stops with NO_COVERAGE and publishes nothing.
# The distinction that matters is between "this scope contains no files" and
# "this scope could not be measured", and a warning cannot carry it.
#
# If a source genuinely is variant-dependent, say so with `optional:`. Then it
# is a declared scope decision, visible in the manifest as
# `disposition: optional, present: false` — rather than a line of stderr nobody
# reads. There is no ALLOW_MISSING escape hatch, because one bypass used once
# becomes one bypass used every run.
#
# (Autodetect, which runs only when no bundles.conf exists, declares everything
# optional: it is guessing at a layout it has never seen, so a miss there really
# is expected.)
#
# EXCLUDE MATCHING
#
# Patterns match against the path RELATIVE TO THE SOURCE ROOT; the root's own
# name is not part of the matched path. That is what lets a config take back a
# globally excluded directory by naming it as a source root:
#
#   dir:myboard/build          # `build` is a global exclude, but naming it as
#                              # the source root stages its contents anyway —
#                              # and the manifest records that it did.
#
# A pattern with no slash matches any single path component; `a/b` matches a
# contiguous run of components; a leading `/` anchors at the source root.
#
# Where a pattern came from is recorded per exclusion as `policy_source`:
#   tool_global    — the export tool's own default
#   project_config — this repo appended it to EXCLUDES below
#   source_decl    — one bundle's `dir:path:extra`, usually because a sibling
#                    bundle carries that scope instead
#
# DECLARING A FILE DOES NOT EXEMPT IT FROM POLICY
#
# `file:` is an inclusion mechanism. The content and disclosure scans run on the
# staged tree, after everything is in place, so a restricted file cannot be
# smuggled past a `dir:` rule by re-declaring it as a `file:`.
#
# ---------------------------------------------------------------------------
# The example below is a typical pnpm/turbo monorepo. Edit to match your repo.
# ---------------------------------------------------------------------------

define_bundle core "domain logic / substrate — the most important bundle for architecture review" \
  dir:packages/core:__snapshots__

define_bundle web "Next.js App Router control plane (app, components, lib, configs)" \
  dir:apps/web

define_bundle cli "command-line interface" \
  dir:apps/cli

define_bundle mcp "MCP stdio server for agent clients" \
  dir:apps/mcp-server

define_bundle bench "benchmarking harness" \
  dir:packages/bench

# Schema construction only — no row data, no seed data.
define_bundle db "database architecture: schema map + forward-only migrations" \
  dir:supabase/migrations \
  file:supabase/config.toml:supabase \
  file:docs/DB_PLAN.md

# CLAUDE.md and AGENTS.md are `optional:` because not every repo has both —
# that is a real layout variation, so it gets declared as one.
define_bundle docs "architecture, ADRs, and conventions" \
  dir:docs \
  dir:adrs \
  optional:dir:prds \
  file:README.md \
  optional:file:AGENTS.md \
  optional:file:CLAUDE.md \
  file:pnpm-workspace.yaml
